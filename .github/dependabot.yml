version: 2
updates:
  # Go module dependencies (go.mod / go.sum)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base image for the ANTLR parser-generation container
  - package-ecosystem: "docker"
    directory: "/thirdparty"
    schedule:
      interval: "weekly"
