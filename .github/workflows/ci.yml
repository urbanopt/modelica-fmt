name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout Repo
        uses: actions/checkout@v7
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      -
        name: Build and Test
        run: make all
